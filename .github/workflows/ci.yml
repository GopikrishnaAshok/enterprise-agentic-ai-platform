
name: Enterprise Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: enterprise-agent-api
  LAMBDA_FUNCTION: enterprise-agent-api

jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Python syntax check
        run: |
          python -m compileall -q backend memory

  docker-build:
    name: Docker Build Validation
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t enterprise-agent-api:test .

  deploy:
    name: Deploy Enterprise Agent
    needs:
      - test
      - docker-build

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t "$IMAGE" .

          docker push "$IMAGE"

          echo "IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"


      - name: Create or update Lambda
        run: |
          if aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" > /dev/null 2>&1; then

            echo "Lambda exists. Updating image..."

            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE_URI" \
              --region "$AWS_REGION"

          else

            echo "Lambda does not exist. Creating..."

            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role arn:aws:iam::917301404773:role/enterprise-agent-lambda-role \
              --architectures x86_64 \
              --timeout 120 \
              --memory-size 1024 \
              --region "$AWS_REGION"

          fi

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-active-v2 \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

      - name: Check Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query '{State:State,Update:LastUpdateStatus,Package:PackageType}'

          STATE=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query State --output text)

          UPDATE=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query LastUpdateStatus --output text)

          test "$STATE" = "Active"
          test "$UPDATE" = "Successful"

  failure:
    name: Pipeline Failure
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build
      - deploy
    if: >-
      always() &&
      contains(needs.*.result, 'failure')

    steps:
      - name: Report failure
        run: |
          echo "Enterprise Agent CI/CD FAILED"
          echo "Commit: ${{ github.sha }}"
          exit 1

  success:
    name: Deployment Successful
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build
      - deployf
    if: needs.deploy.result == 'success'

    steps:
      - name: Report success
        run: |
          echo "Enterprise Agent CI/CD SUCCESS"
          echo "Tests passed"
          echo "Docker build passed"
          echo "ECR push completed"
          echo "Lambda update completed"
