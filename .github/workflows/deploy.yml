
name: Deploy - Enterprise Agentic AI Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  deployment-readiness:
    name: Check Deployment Prerequisites
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment entry point
        run: |
          if [ ! -f "lambda_function.py" ]; then
            echo "::error::Deployment blocked: lambda_function.py does not exist yet."
            echo "Create and test a Lambda handler before enabling AWS deployment."
            exit 1
          fi

          echo "Lambda entry-point file found."
